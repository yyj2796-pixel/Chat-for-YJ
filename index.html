<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 웹 채팅</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-center items-center p-2 sm:p-4 md:p-6 select-none">

    <!-- 메인 채팅 카테고리/컨테이너 -->
    <div class="w-full max-w-2xl h-[95vh] sm:h-[85vh] bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden border border-slate-200">
        
        <!-- 상단 헤더 -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-inner">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">실시간 채팅방</h1>
                    <p class="text-xs text-indigo-200 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                        Firebase RTDB 연동됨
                    </p>
                </div>
            </div>
            
            <!-- 닉네임 변경 버튼 -->
            <button id="change-name-btn" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-indigo-100 font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-sm active:scale-95">
                <i class="fa-solid fa-user-pen"></i>
                <span id="current-user-display">닉네임 설정</span>
            </button>
        </div>

        <!-- 채팅 메시지 영역 -->
        <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50 relative">
            <!-- 초기 로딩 표시 -->
            <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50/80 backdrop-blur-sm z-10 transition-opacity duration-300">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-2"></i>
                <p class="text-sm text-slate-500 font-medium">메시지를 불러오는 중...</p>
            </div>

            <!-- 메시지가 없을 때 안내 -->
            <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-slate-400">
                <i class="fa-regular fa-paper-plane text-4xl mb-3 text-slate-300"></i>
                <p class="text-sm font-medium">아직 메시지가 없습니다.</p>
                <p class="text-xs text-slate-400 mt-1">첫 번째 메시지를 남겨보세요!</p>
            </div>

            <!-- 메시지 목록이 여기에 동적으로 추가됩니다 -->
        </div>

        <!-- 하단 메시지 입력창 -->
        <div class="p-3 bg-white border-t border-slate-200 shadow-lg">
            <form id="chat-form" class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="메시지를 입력하세요..." 
                    class="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-slate-800 placeholder-slate-400"
                    autocomplete="off"
                    required
                />
                <button 
                    type="submit" 
                    id="send-btn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-5 py-3 text-sm font-semibold transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-95"
                >
                    <span>전송</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 닉네임 설정 모달 -->
    <div id="nickname-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden transition-all duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm transform transition-all scale-100">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">닉네임 설정</h2>
                <p class="text-xs text-slate-500 mt-1">채팅에서 사용할 이름을 입력해 주세요.</p>
            </div>
            <form id="nickname-form">
                <input 
                    type="text" 
                    id="nickname-input" 
                    placeholder="예: 홍길동" 
                    maxlength="15"
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm mb-4 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-slate-800"
                    required
                />
                <div class="flex gap-2">
                    <button 
                        type="button" 
                        id="cancel-nickname-btn" 
                        class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl py-2.5 text-sm font-medium transition-all"
                    >
                        취소
                    </button>
                    <button 
                        type="submit" 
                        class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 text-sm font-medium transition-all shadow-md"
                    >
                        저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Modular JS v10 CDN 사용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase 설정 (주어진 Realtime Database URL 사용)
        const firebaseConfig = {
            databaseURL: "https://chat-for-yj-default-rtdb.firebaseio.com/"
        };

        // Firebase 앱 및 DB 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // 데이터 저장 경로: /Chat
        const chatRef = ref(db, 'Chat');

        // DOM 요소 가져오기
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const nicknameModal = document.getElementById('nickname-modal');
        const nicknameForm = document.getElementById('nickname-form');
        const nicknameInput = document.getElementById('nickname-input');
        const currentUserDisplay = document.getElementById('current-user-display');
        const changeNameBtn = document.getElementById('change-name-btn');
        const cancelNicknameBtn = document.getElementById('cancel-nickname-btn');
        const loadingSpinner = document.getElementById('loading-spinner');
        const emptyState = document.getElementById('empty-state');

        // 사용자 닉네임 상태 (localStorage 연동)
        let currentUser = localStorage.getItem('chat_username') || '';

        // 초기화 함수
        function initApp() {
            if (!currentUser) {
                // 저장된 닉네임이 없으면 랜덤 닉네임 생성 후 모달 표시
                currentUser = '사용자_' + Math.floor(Math.random() * 8999 + 1000);
                localStorage.setItem('chat_username', currentUser);
                showNicknameModal();
            }
            updateUserUI();
            listenToMessages();
        }

        // 닉네임 표시 UI 업데이트
        function updateUserUI() {
            currentUserDisplay.textContent = currentUser;
        }

        // 닉네임 설정 모달 열기/닫기
        function showNicknameModal() {
            nicknameInput.value = currentUser;
            nicknameModal.classList.remove('hidden');
            nicknameInput.focus();
        }

        function hideNicknameModal() {
            nicknameModal.classList.add('hidden');
        }

        changeNameBtn.addEventListener('click', showNicknameModal);
        cancelNicknameBtn.addEventListener('click', hideNicknameModal);

        // 닉네임 변경 폼 제출
        nicknameForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newName = nicknameInput.value.trim();
            if (newName) {
                currentUser = newName;
                localStorage.setItem('chat_username', currentUser);
                updateUserUI();
                hideNicknameModal();
                
                // 내가 보낸 메시지 스타일 갱신을 위해 재렌더링
                listenToMessages();
            }
        });

        // 날짜/시간 포맷팅 함수 (YYYY-MM-DD HH:mm:ss 또는 읽기 쉬운 형식)
        function formatTimestamp(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            
            // 날짜 변환 실패 시 기존 문자열 그대로 반환
            if (isNaN(date.getTime())) return timestamp;

            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();

            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;

            if (isToday) {
                return timeStr;
            } else {
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${month}/${day} ${timeStr}`;
            }
        }

        // HTML 특수문자 이스케이프 (XSS 방지)
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 실시간 메시지 수신 리스너 (최근 100개 메시지)
        function listenToMessages() {
            const recentChatQuery = query(chatRef, limitToLast(100));

            onValue(recentChatQuery, (snapshot) => {
                // 로딩 스피너 숨기기
                if (loadingSpinner) {
                    loadingSpinner.style.opacity = '0';
                    setTimeout(() => loadingSpinner.classList.add('hidden'), 300);
                }

                messagesContainer.innerHTML = ''; // 기존 목록 초기화

                if (!snapshot.exists()) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                const data = snapshot.val();

                // 데이터 객체를 배열로 변환
                Object.keys(data).forEach((key) => {
                    const msg = data[key];
                    appendMessageUI(msg);
                });

                // 메시지 수신 시 하단으로 자동 스크롤
                scrollToBottom();
            }, (error) => {
                console.error("Firebase 읽기 에러:", error);
                loadingSpinner.innerHTML = `<p class="text-red-500 text-sm">데이터를 불러오지 못했습니다.<br>Firebase Rules 설정을 확인하세요.</p>`;
            });
        }

        // 메시지 하나를 UI에 그리는 함수
        function appendMessageUI(msg) {
            const sender = msg.sender || '익명';
            const text = msg.text || '';
            const rawTime = msg.timestamp || '';
            const formattedTime = formatTimestamp(rawTime);

            const isMe = sender === currentUser;

            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3`;

            const safeSender = escapeHtml(sender);
            const safeText = escapeHtml(text).replace(/\n/g, '<br>');

            if (isMe) {
                // 내가 보낸 메시지 (우측 정렬, 보라색 버블)
                messageWrapper.innerHTML = `
                    <div class="flex items-end gap-1.5 max-w-[85%] sm:max-w-[75%]">
                        <span class="text-[10px] text-slate-400 select-none pb-1">${formattedTime}</span>
                        <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-2.5 shadow-sm text-sm break-words leading-relaxed">
                            ${safeText}
                        </div>
                    </div>
                `;
            } else {
                // 타인이 보낸 메시지 (좌측 정렬, 흰색 버블)
                messageWrapper.innerHTML = `
                    <span class="text-xs text-slate-500 font-medium mb-1 ml-1 select-none">${safeSender}</span>
                    <div class="flex items-end gap-1.5 max-w-[85%] sm:max-w-[75%]">
                        <div class="bg-white text-slate-800 border border-slate-200 rounded-2xl rounded-tl-none px-4 py-2.5 shadow-sm text-sm break-words leading-relaxed">
                            ${safeText}
                        </div>
                        <span class="text-[10px] text-slate-400 select-none pb-1">${formattedTime}</span>
                    </div>
                `;
            }

            messagesContainer.appendChild(messageWrapper);
        }

        // 스크롤 맨 아래로 이동
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 메시지 전송 이벤트 처리
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const text = messageInput.value.trim();
            if (!text) return;

            // 현재 시간을 ISO 포맷 및 읽기 쉬운 포맷으로 함께 처리 가능한 타임스탬프 생성
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            // 전송 데이터 생성 (요청한 필드명 기준: sender, text, timestamp)
            const messageData = {
                sender: currentUser,
                text: text,
                timestamp: `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`
            };

            // Firebase RTDB에 push (자동으로 유니크 ID 생성하며 저장)
            push(chatRef, messageData)
                .then(() => {
                    messageInput.value = '';
                    messageInput.focus();
                })
                .catch((error) => {
                    console.error("메시지 전송 실패:", error);
                    alert("메시지 전송에 실패했습니다. Firebase 규칙(Security Rules)을 확인해 주세요.");
                });
        });

        // 엔터키 전송 지원 (Shift+Enter는 줄바꿈 지원 가능 확장 구조)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // 앱 시작
        initApp();
    </script>
</body>
</html>
