<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크 삭제 안내</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }

        /* 영어로 크게 표시되는 문구 */
        .title {
            font-size: 3rem;
            font-weight: bold;
            color: #e63946;
            margin-bottom: 20px;
        }

        /* 안내 문구 및 링크 */
        .message {
            font-size: 1.2rem;
            color: #555;
        }

        .link-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 1.1rem;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .link-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="title">This link has been deleted.</div>
    
    <div class="message">
        아래 버튼을 눌러 이동해 주세요:
        <br>
        <a class="link-button" href="https://yyj2796-pixel.github.io/Chat/">새 링크로 이동하기</a>
    </div>

</body>
</html>
